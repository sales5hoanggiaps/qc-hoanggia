services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qc
      POSTGRES_PASSWORD: qc_dev_password
      POSTGRES_DB: qc_hoanggia
    ports:
      - "5433:5432"
    volumes:
      - qc_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qc_minio
      MINIO_ROOT_PASSWORD: qc_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - qc_minio_data:/data

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides .env's DATABASE_URL: inside the Compose network the web
      # container reaches Postgres at the service name "postgres" on its
      # container port 5432 — "localhost:5433" (the host-side mapping used
      # for local `npm run dev`) refers to the web container itself here
      # and would not connect.
      DATABASE_URL: postgresql://qc:qc_dev_password@postgres:5432/qc_hoanggia
      # Same reasoning as DATABASE_URL above: inside the Compose network the
      # worker is reachable at the service name "worker" on its container
      # port 4100 — "localhost:4100" (used for local `npm run dev`) would
      # refer to the web container itself here.
      SYNC_WORKER_URL: http://worker:4100
      # Same reasoning: inside the Compose network the "minio" service name
      # resolves to the minio container, not "localhost".
      STORAGE_ENDPOINT: http://minio:9000
      # Unlike STORAGE_ENDPOINT above, this one is handed to the BROWSER in
      # presigned URLs — it must resolve from the user's machine, not from
      # inside the Compose network, so "minio" (the internal hostname) would
      # not work here. Port 9000 is published to the host below, so
      # localhost:9000 works out of the box for local `docker compose up`;
      # override via a real deployment's own .env for a real public hostname.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
    depends_on:
      - postgres
      - minio
    ports:
      - "3100:3000"

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://qc:qc_dev_password@postgres:5432/qc_hoanggia
      STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - minio

volumes:
  qc_postgres_data:
  qc_minio_data:
