# =============================================================================
# CẤU HÌNH NGINX REVERSE PROXY CHO APP QC HOÀNG GIA
# Đường dẫn cài đặt trên VPS: /etc/nginx/sites-available/qc-hoanggia
# Tên miền truy cập: qc.103-149-170-221.sslip.io (proxy vào port 3100)
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name qc.103-149-170-221.sslip.io;

    # Giới hạn kích thước upload ảnh/PDF biên bản QC
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # Headers chuẩn cho Next.js PWA và WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Forward IP thực tế và Scheme
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts xử lý đồng bộ và export báo cáo
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
